[package]
name = "vectorcache"
version = "0.1.0"
edition = "2021"
description = "Block-based multi-level quantized vector retrieval engine"
license = "MIT OR Apache-2.0"

[lib]
name = "vectorcache"
path = "src/lib.rs"

[[bin]]
name = "fetch-datasets"
path = "src/bin/fetch_datasets.rs"

[[bin]]
name = "ingest-sample"
path = "src/bin/ingest_sample.rs"

[[bin]]
name = "ingest-bench"
path = "src/bin/ingest_bench.rs"

[dependencies]
anyhow = "1"
arrow-array = "54"
bytemuck = "1"
clap = { version = "4", features = ["derive", "env"] }
memmap2 = "0.9"
ndarray = "0.16"
ndarray-npy = "0.9"
parquet = { version = "54", features = ["arrow"] }
rand = "0.8"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking"] }
wide = "0.7"

[dependencies.hdf5]
version = "0.8"
optional = true

[features]
default = []
# GloVe HDF5 reader and validation (requires HDF5 C library at build time).
glove = ["dep:hdf5"]

[dev-dependencies]
tempfile = "3"
